name: Tests de la refonte HAC

on:
  push:
    branches: [Refonte]
    paths:
      - "refonte/domain/**"
      - "refonte/backend/**"
      - "refonte/application/**"
      - "refonte/build/**"
      - "refonte/demo/**"
      - "refonte/app/**"
      - "refonte/migration/**"
      - "refonte/README.md"
      - ".github/workflows/refonte-tests.yml"
  pull_request:
    branches: [Refonte]
    paths:
      - "refonte/domain/**"
      - "refonte/backend/**"
      - "refonte/application/**"
      - "refonte/build/**"
      - "refonte/demo/**"
      - "refonte/app/**"
      - ".github/workflows/refonte-tests.yml"

concurrency:
  group: refonte-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Générer le bundle navigateur
        run: node refonte/build/build-browser.mjs
      - name: Vérifier que le bundle commité est à jour
        run: git diff --exit-code -- refonte/demo/hac-core.js refonte/app/hac-app.js
      - name: Vérifier la syntaxe de l’application v3
        run: node --check refonte/app/app.js && node --check refonte/app/e2e-navigateur.js && node --check refonte/app/e2e-essai.js && node --check refonte/app/e2e-salarie.js && node --check refonte/app/e2e-signalements-membre.js
      - name: Vérifier la syntaxe du candidat Apps Script v3
        run: node --check < refonte/backend/apps-script/Code.gs
      - name: Exécuter tous les tests métier
        run: node --test refonte/domain/*.test.js refonte/application/*.test.js refonte/backend/*.test.js refonte/backend/apps-script/*.test.js refonte/migration/*.test.js refonte/app/*.test.js
      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium --only-shell
      - name: Tester l’application dans Chromium
        run: |
          python3 -m http.server 8766 --bind 0.0.0.0 > /tmp/hac-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8766/refonte/app/index.html >/dev/null; then break; fi
            sleep 1
          done
          node refonte/app/e2e-navigateur.js
          node refonte/app/e2e-essai.js
          node refonte/app/e2e-salarie.js
          node refonte/app/e2e-signalements-membre.js
      - name: Vérifier l’interface isolée
        run: node refonte/demo/validate-demo.mjs
