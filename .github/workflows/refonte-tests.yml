name: Tests de la refonte HAC

on:
  push:
    branches: [Refonte]
    paths:
      - "refonte/domain/**"
      - "refonte/backend/**"
      - "refonte/application/**"
      - "refonte/build/**"
      - "refonte/demo/**"
      - "refonte/README.md"
      - ".github/workflows/refonte-tests.yml"
  pull_request:
    branches: [Refonte]
    paths:
      - "refonte/domain/**"
      - "refonte/backend/**"
      - "refonte/application/**"
      - "refonte/build/**"
      - "refonte/demo/**"
      - ".github/workflows/refonte-tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Générer le bundle navigateur
        run: node refonte/build/build-browser.mjs
      - name: Vérifier que le bundle commité est à jour
        run: git diff --exit-code -- refonte/demo/hac-core.js
      - name: Vérifier l’interface isolée
        run: node refonte/demo/validate-demo.mjs
      - name: Exécuter tous les tests métier
        run: node --test refonte/domain/*.test.js refonte/application/*.test.js refonte/backend/*.test.js
