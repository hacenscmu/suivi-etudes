<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8fc">
<title>HAC — Aperçu de la refonte</title>
<style>
:root{color-scheme:light;--pink:#d5197f;--pink-soft:#fff0f7;--ink:#242129;--muted:#817985;--line:#eee8ed;--bg:#fff;--canvas:#faf8fa;--green:#21845b;--amber:#a86a13;--red:#bd3b52}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1120px;margin:auto;min-height:100dvh;padding:0 22px 100px}.top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px}.mark{width:38px;height:38px;border-radius:13px;background:var(--pink);color:white;display:grid;place-items:center;font-weight:800;letter-spacing:-1px}.brand strong{font-size:17px;letter-spacing:-.4px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:1px}.period{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 12px;color:#5e5660;font-size:12px}.welcome{padding:27px 0 20px;display:flex;justify-content:space-between;align-items:end}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--pink);text-transform:uppercase}.welcome h1{font-size:27px;letter-spacing:-1px;margin:5px 0 0}.welcome p{color:var(--muted);margin:4px 0 0;font-size:13px}.nav{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:23px}.nav button{border:0;background:none;color:var(--muted);padding:12px 15px 13px;font-size:13px;border-bottom:2px solid transparent}.nav button.active{color:var(--pink);font-weight:700;border-color:var(--pink)}.section-head{display:flex;align-items:center;justify-content:space-between;margin:25px 0 13px}.section-head h2{font-size:16px;margin:0;letter-spacing:-.3px}.section-head span{font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel,.listbox{background:white;border:1px solid var(--line);border-radius:15px}.stat{padding:16px 17px}.stat .label{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:25px;letter-spacing:-1px;margin:7px 0 2px}.stat small{font-size:11px;color:var(--muted)}.accent{color:var(--pink)}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.panel{padding:18px}.panel h3{font-size:13px;margin:0 0 4px}.sub{font-size:11px;color:var(--muted)}.bars{display:flex;align-items:end;gap:17px;height:140px;padding:20px 4px 0;border-bottom:1px solid var(--line)}.barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:end}.bar{width:min(34px,65%);background:#f5b7d7;border-radius:7px 7px 2px 2px;min-height:4px;position:relative}.bar.hot{background:var(--pink)}.barcol small{font-size:10px;color:var(--muted)}.barcol b{font-size:10px;font-weight:600}.legend{display:flex;gap:14px;margin-top:13px;color:var(--muted);font-size:10px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pink);margin-right:5px}.dot.pale{background:#f5b7d7}.ring-wrap{display:flex;align-items:center;gap:17px;padding:17px 0 4px}.ring{width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--pink) 0 72%,#f4eaf0 72% 100%);display:grid;place-items:center;flex:none}.ring:after{content:"72%";width:68px;height:68px;background:white;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:750}.ring-info strong{font-size:23px;display:block}.ring-info small{font-size:11px;color:var(--muted)}.alert{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-top:1px solid var(--line)}.alert:first-of-type{border-top:0}.alert-icon{width:27px;height:27px;border-radius:9px;background:#fff4e6;color:var(--amber);display:grid;place-items:center;font-weight:700;flex:none}.alert strong{font-size:12px;display:block}.alert small{font-size:11px;color:var(--muted)}.action{border:0;background:var(--pink);color:white;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:650}.ghost{background:white;color:var(--ink);border:1px solid var(--line)}.toolbar{display:flex;gap:8px;align-items:center}.search{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 12px;width:min(260px,50vw);font-size:12px}.rows{display:flex;flex-direction:column}.item{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item-main{flex:1;min-width:0}.item strong{font-size:13px;display:block}.item small{font-size:11px;color:var(--muted)}.pill{font-size:10px;border-radius:20px;padding:5px 8px;background:#f5f1f4;color:#655c66;white-space:nowrap}.pill.pink{background:var(--pink-soft);color:var(--pink)}.pill.green{background:#eaf7f0;color:var(--green)}.amount{font-size:12px;font-weight:700;white-space:nowrap}.empty{padding:35px;text-align:center;color:var(--muted);font-size:13px}.hidden{display:none!important}.demo-note{background:#fff7e8;color:#80581e;border:1px solid #f3dfba;border-radius:10px;padding:10px 12px;font-size:11px;margin-top:18px}.mobile-nav{display:none}
@media(max-width:700px){.app{padding:0 15px 90px}.top{height:65px}.welcome{padding:22px 0 17px}.welcome h1{font-size:23px}.period{font-size:10px;padding:8px}.nav{display:none}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.grid{grid-template-columns:1fr}.section-head{margin-top:22px}.panel{padding:15px}.mobile-nav{display:flex;position:fixed;z-index:3;bottom:0;left:0;right:0;padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(14px);border-top:1px solid var(--line);justify-content:space-around}.mobile-nav button{border:0;background:none;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:54px}.mobile-nav button b{font-size:18px;font-weight:500}.mobile-nav button.active{color:var(--pink)}.item{padding:13px 12px}.toolbar{width:100%}.search{flex:1;width:auto}.section-head.wrap{align-items:flex-start;gap:10px;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="mark">H</div><div><strong>HAC</strong><small>Suivi des études</small></div></div><button class="period" type="button">Mandat 2026–2027⌄</button></header>
<section class="welcome"><div><div class="eyebrow">Mardi 10 novembre 2026</div><h1 id="greeting">Bonjour 👋</h1><p>Voici ce qui se passe dans la Junior.</p></div><button class="action" id="quickAdd">＋ Nouvelle étude</button></section>
<nav class="nav" id="tabs"></nav>
<main id="content"></main>
<div class="demo-note">Aperçu interactif — données entièrement fictives. Aucune connexion à la base HAC et aucune modification des données réelles.</div>
</div>
<nav class="mobile-nav" id="mobileTabs"></nav>
<script>
const data={
 studies:[{name:"Audit énergétique",client:"Soléa Industrie",status:"En cours",amount:4200,paid:2100,kind:"Ponctuelle"},{name:"Étude de marché",client:"Novalys",status:"À facturer",amount:2800,paid:0,kind:"Récurrente"},{name:"Optimisation process",client:"Alsachim",status:"Terminée",amount:3600,paid:3600,kind:"Ponctuelle"},{name:"Veille réglementaire",client:"Novalys",status:"En cours",amount:1200,paid:400,kind:"Récurrente"}],
 invoices:[{ref:"FAC-2026-018",study:"Audit énergétique",client:"Soléa Industrie",due:"12 nov. 2026",amount:2100,state:"Émise"},{ref:"FAC-2026-016",study:"Étude de marché",client:"Novalys",due:"05 nov. 2026",amount:1400,state:"En retard"},{ref:"FAC-2026-014",study:"Optimisation process",client:"Alsachim",due:"Payée le 28 oct.",amount:3600,state:"Payée"}],
 team:[{name:"Camille Martin",role:"Cheffe de projet",jeh:8.5},{name:"Lucas Bernard",role:"Consultant",jeh:6},{name:"Sarah Petit",role:"Consultante",jeh:4.5},{name:"Thomas Meyer",role:"Consultant",jeh:3}]
};
const pages=["Accueil","Études","Finances","Équipe","Réglages"];let current="Accueil";
const icons=["⌂","▤","€","♙","⚙"];
const money=n=>new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);
function nav(){["tabs","mobileTabs"].forEach(id=>document.getElementById(id).innerHTML=pages.map((p,i)=>'<button data-page="'+p+'" class="'+(p===current?'active':'')+'">'+(id==="mobileTabs"?'<b>'+icons[i]+'</b>':'')+p+'</button>').join(""));document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{current=b.dataset.page;render()})}
function heading(title,sub,action=""){return '<div class="section-head"><div><h2>'+title+'</h2><span>'+sub+'</span></div>'+action+'</div>'}
function dashboard(){return '<div class="stats"><div class="stat"><div class="label">JEH travaillées · étudiants</div><strong>22,5</strong><small><span class="accent">+3,5</span> ce mois-ci</small></div><div class="stat"><div class="label">Chiffre d’affaires signé</div><strong>11 800 €</strong><small>4 études actives ou terminées</small></div><div class="stat"><div class="label">Déjà encaissé</div><strong>6 100 €</strong><small>52 % du CA signé</small></div><div class="stat"><div class="label">À encaisser</div><strong>5 700 €</strong><small>2 factures à suivre</small></div></div>'+heading("Activité","JEH travaillées par les étudiants · 6 derniers mois")+'<div class="grid"><section class="panel"><h3>Une activité qui progresse</h3><div class="sub">Volume de JEH réellement effectuées</div><div class="bars">'+[["Juin",11],["Juil.",15],["Août",8],["Sept.",17],["Oct.",19],["Nov.",22.5]].map((x,i)=>'<div class="barcol"><b>'+x[1]+'</b><div class="bar '+(i===5?'hot':'')+'" style="height:'+(x[1]/24*100)+'%"></div><small>'+x[0]+'</small></div>').join("")+'</div><div class="legend"><span><i class="dot"></i>JEH effectuées</span><span><i class="dot pale"></i>Mois précédents</span></div></section><section class="panel"><h3>Encaissement des études</h3><div class="sub">Part du CA signé déjà encaissée</div><div class="ring-wrap"><div class="ring"></div><div class="ring-info"><strong>6 100 €</strong><small>sur 11 800 € signés</small></div></div><div class="sub">5 700 € restent à encaisser</div></section></div>'+heading("À surveiller","Les prochaines actions")+'<section class="panel"><div class="alert"><div class="alert-icon">!</div><div><strong>Facture en retard · Novalys</strong><small>Étude de marché · 1 400 € · échéance dépassée</small></div></div><div class="alert"><div class="alert-icon">↗</div><div><strong>Solde à facturer · Audit énergétique</strong><small>Soléa Industrie · étude en cours</small></div></div><div class="alert"><div class="alert-icon">◷</div><div><strong>Échéance à venir · Alsachim</strong><small>Vérifier la clôture administrative de l’étude</small></div></div></section>'}
function studies(){return heading("Études","4 études · données de démonstration",'<div class="toolbar"><input class="search" id="search" placeholder="Rechercher une étude…"><button class="action" id="addStudy">＋ Ajouter</button></div>')+'<section class="listbox rows" id="studyRows">'+data.studies.map(s=>'<div class="item"><div class="item-main"><strong>'+s.name+'</strong><small>'+s.client+' · '+s.kind+'</small></div><span class="pill '+(s.status==="Terminée"?"green":s.status==="À facturer"?"pink":"")+'">'+s.status+'</span><div class="amount">'+money(s.amount)+'</div></div>').join("")+'</section>'}
function finances(){return '<div class="stats"><div class="stat"><div class="label">Facturé</div><strong>7 100 €</strong><small>3 factures émises</small></div><div class="stat"><div class="label">Encaissé</div><strong>6 100 €</strong><small>2 factures payées</small></div><div class="stat"><div class="label">En attente</div><strong>1 000 €</strong><small>1 facture en retard</small></div><div class="stat"><div class="label">À facturer</div><strong>4 700 €</strong><small>Sur les études en cours</small></div></div>'+heading("Factures","Suivi des échéances")+'<section class="listbox rows">'+data.invoices.map(f=>'<div class="item"><div class="item-main"><strong>'+f.ref+' · '+f.client+'</strong><small>'+f.study+' · '+f.due+'</small></div><span class="pill '+(f.state==="Payée"?"green":f.state==="En retard"?"pink":"")+'">'+f.state+'</span><div class="amount">'+money(f.amount)+'</div></div>').join("")+'</section>'}
function team(){return heading("Équipe","Activité des étudiants · JEH réellement travaillées")+'<section class="listbox rows">'+data.team.map(m=>'<div class="item"><div class="mark" style="width:36px;height:36px;border-radius:50%;font-size:12px">'+m.name.split(" ").map(x=>x[0]).join("")+'</div><div class="item-main"><strong>'+m.name+'</strong><small>'+m.role+'</small></div><div class="amount">'+m.jeh.toLocaleString("fr-FR")+' JEH</div></div>').join("")+'</section>'}
function settings(){return heading("Réglages","Préférences de l’application")+'<section class="listbox rows"><div class="item"><div class="item-main"><strong>Apparence</strong><small>Thème clair, sombre ou système</small></div><span class="pill">Système</span></div><div class="item"><div class="item-main"><strong>Tableau de bord</strong><small>Réorganiser ou masquer les indicateurs</small></div><span>›</span></div><div class="item"><div class="item-main"><strong>Paramètres JEH</strong><small>Plafond et règles de calcul</small></div><span>›</span></div><div class="item"><div class="item-main"><strong>Alertes factures</strong><small>Règles adaptées aux clients ponctuels ou récurrents</small></div><span>›</span></div></section>'}
function render(){nav();document.getElementById("content").innerHTML=({Accueil:dashboard,Études:studies,Finances:finances,Équipe:team,Réglages:settings})[current]();const q=document.getElementById("search");if(q)q.oninput=()=>{document.querySelectorAll("#studyRows .item").forEach(el=>el.style.display=el.textContent.toLowerCase().includes(q.value.toLowerCase())?"":"none")};const add=document.getElementById("addStudy");if(add)add.onclick=()=>alert("Dans la version complète, ce bouton ouvrira le formulaire d’étude.") }
document.getElementById("quickAdd").onclick=()=>{current="Études";render();document.getElementById("addStudy")?.click()};render();
</script>
</body></html>
