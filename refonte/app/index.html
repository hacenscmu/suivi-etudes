<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8fc">
<title>HAC</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../../icon-192.png">
<style>
:root{color-scheme:light;--pink:#d5197f;--pink-soft:#fff0f7;--ink:#242129;--muted:#817985;--line:#eee8ed;--bg:#fff;--canvas:#faf8fa;--green:#21845b;--amber:#a86a13;--red:#bd3b52}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1120px;margin:auto;min-height:100dvh;padding:0 22px 100px}.top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px}.mark{width:38px;height:38px;border-radius:13px;background:var(--pink);color:white;display:grid;place-items:center;font-weight:800;letter-spacing:-1px}.brand strong{font-size:17px;letter-spacing:-.4px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:1px}.period{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 12px;color:#5e5660;font-size:12px}.welcome{padding:27px 0 20px;display:flex;justify-content:space-between;align-items:end}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--pink);text-transform:uppercase}.welcome h1{font-size:27px;letter-spacing:-1px;margin:5px 0 0}.welcome p{color:var(--muted);margin:4px 0 0;font-size:13px}.nav{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:23px}.nav button{border:0;background:none;color:var(--muted);padding:12px 15px 13px;font-size:13px;border-bottom:2px solid transparent}.nav button.active{color:var(--pink);font-weight:700;border-color:var(--pink)}.section-head{display:flex;align-items:center;justify-content:space-between;margin:25px 0 13px}.section-head h2{font-size:16px;margin:0;letter-spacing:-.3px}.section-head span{font-size:12px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel,.listbox{background:white;border:1px solid var(--line);border-radius:15px}.stat{padding:16px 17px}.stat .label{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:25px;letter-spacing:-1px;margin:7px 0 2px}.stat small{font-size:11px;color:var(--muted)}.accent{color:var(--pink)}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.panel{padding:18px}.panel h3{font-size:13px;margin:0 0 4px}.sub{font-size:11px;color:var(--muted)}.bars{display:flex;align-items:end;gap:17px;height:140px;padding:20px 4px 0;border-bottom:1px solid var(--line)}.barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:end}.bar{width:min(34px,65%);background:#f5b7d7;border-radius:7px 7px 2px 2px;min-height:4px;position:relative}.bar.hot{background:var(--pink)}.barcol small{font-size:10px;color:var(--muted)}.barcol b{font-size:10px;font-weight:600}.legend{display:flex;gap:14px;margin-top:13px;color:var(--muted);font-size:10px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pink);margin-right:5px}.dot.pale{background:#f5b7d7}.ring-wrap{display:flex;align-items:center;gap:17px;padding:17px 0 4px}.ring{width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--pink) 0 72%,#f4eaf0 72% 100%);display:grid;place-items:center;flex:none}.ring:after{content:"72%";width:68px;height:68px;background:white;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:750}.ring-info strong{font-size:23px;display:block}.ring-info small{font-size:11px;color:var(--muted)}.alert{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-top:1px solid var(--line)}.alert:first-of-type{border-top:0}.alert-icon{width:27px;height:27px;border-radius:9px;background:#fff4e6;color:var(--amber);display:grid;place-items:center;font-weight:700;flex:none}.alert strong{font-size:12px;display:block}.alert small{font-size:11px;color:var(--muted)}.action{border:0;background:var(--pink);color:white;border-radius:10px;padding:10px 14px;font-size:12px;font-weight:650}.ghost{background:white;color:var(--ink);border:1px solid var(--line)}.toolbar{display:flex;gap:8px;align-items:center}.search{border:1px solid var(--line);background:white;border-radius:10px;padding:10px 12px;width:min(260px,50vw);font-size:12px}.rows{display:flex;flex-direction:column}.item{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item-main{flex:1;min-width:0}.item strong{font-size:13px;display:block}.item small{font-size:11px;color:var(--muted)}.pill{font-size:10px;border-radius:20px;padding:5px 8px;background:#f5f1f4;color:#655c66;white-space:nowrap}.pill.pink{background:var(--pink-soft);color:var(--pink)}.pill.green{background:#eaf7f0;color:var(--green)}.amount{font-size:12px;font-weight:700;white-space:nowrap}.empty{padding:35px;text-align:center;color:var(--muted);font-size:13px}.hidden{display:none!important}.demo-note{background:#fff7e8;color:#80581e;border:1px solid #f3dfba;border-radius:10px;padding:10px 12px;font-size:11px;margin-top:18px}.mobile-nav{display:none}
@media(max-width:700px){.app{padding:0 15px 90px}.top{height:65px}.welcome{padding:22px 0 17px}.welcome h1{font-size:23px}.period{font-size:10px;padding:8px}.nav{display:none}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.grid{grid-template-columns:1fr}.section-head{margin-top:22px}.panel{padding:15px}.mobile-nav{display:flex;position:fixed;z-index:3;bottom:0;left:0;right:0;padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(14px);border-top:1px solid var(--line);justify-content:space-around}.mobile-nav button{border:0;background:none;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:54px}.mobile-nav button b{font-size:18px;font-weight:500}.mobile-nav button.active{color:var(--pink)}.item{padding:13px 12px}.toolbar{width:100%}.search{flex:1;width:auto}.section-head.wrap{align-items:flex-start;gap:10px;flex-direction:column}}
.study-dialog{width:min(460px,calc(100% - 28px));border:1px solid var(--line);border-radius:18px;padding:22px;color:var(--ink);box-shadow:0 20px 70px #24102030}.study-dialog::backdrop{background:#21131d66;backdrop-filter:blur(3px)}.study-dialog form{display:grid;gap:14px}.study-dialog label{display:grid;gap:6px;font-size:12px;font-weight:650}.study-dialog input,.study-dialog select{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;background:white;color:var(--ink)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}.close-dialog{border-radius:50%;width:32px;height:32px;font-size:20px}.invoice-button{width:100%;border:0;background:white;text-align:left;font:inherit}.invoice-button:hover{background:var(--canvas)}
.sync{border-radius:10px;padding:10px 12px;font-size:12px;margin-top:12px}.sync.warn{background:#fff7e8;color:#80581e;border:1px solid #f3dfba}.sync.conflict{background:#fdecef;color:var(--red);border:1px solid #f5c6d0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.login{position:fixed;inset:0;z-index:9;background:var(--canvas);display:grid;place-items:center;padding:20px}.login form{background:white;border:1px solid var(--line);border-radius:18px;padding:24px;width:min(420px,100%);display:grid;gap:14px}.login label{display:grid;gap:6px;font-size:12px;font-weight:650}.login input{border:1px solid var(--line);border-radius:9px;padding:11px;font:inherit}.login p{margin:0;color:var(--muted);font-size:12px}#loginMsg{color:var(--red)}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="mark">H</div><div><strong>HAC</strong><small>Suivi des études</small></div></div><select class="period" id="mandatSel" aria-label="Mandat"></select></header>
<section class="welcome"><div><div class="eyebrow" id="today"></div><h1 id="greeting">Bonjour 👋</h1><p>Voici ce qui se passe dans la Junior.</p></div><button class="action" id="quickAdd">＋ Nouvelle étude</button></section>
<div id="syncBanner" class="sync hidden"></div>
<nav class="nav" id="tabs"></nav>
<main id="content"></main>

</div>
<nav class="mobile-nav" id="mobileTabs"></nav>
<div class="login hidden" id="login"><form id="loginForm"><div class="brand"><div class="mark">H</div><div><strong>HAC</strong><small>Connexion</small></div></div>
<p>Saisissez une seule fois sur cet appareil l’adresse du serveur HAC et votre jeton personnel (donnés par la trésorerie).</p>
<label>Adresse du serveur<input name="url" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
<label>Jeton personnel<input name="token" type="password" autocomplete="off"></label>
<button class="action" type="submit">Se connecter</button><p id="loginMsg"></p>
<button class="ghost action" type="button" id="essai">Essayer sans serveur (données d’exemple)</button></form></div>
<script src="./hac-app.js"></script>
<script src="./app.js"></script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));document.getElementById("today").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});</script>
</body></html>
